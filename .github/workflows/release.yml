name: Create Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  call_tests:
    uses: ./.github/workflows/tests.yml

  create_release:
    runs-on: ubuntu-latest
    needs: call_tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Application JAR for the Release
        run: make release

      - name: Extract Tamarin Version
        id: get_version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Package Release Artifacts
        run: |
          mkdir -p release-dist
          cd target/quarkus-app
          tar -czf ../../release-dist/tamarind-${{ env.VERSION }}.tar.gz *
          zip -r ../../release-dist/tamarind-${{ env.VERSION }}.zip *
          cd ../..
          cp target/tamarind-${{ env.VERSION }}-sources.jar release-dist/
          cp target/tamarind-${{ env.VERSION }}-javadoc.jar release-dist/

      - name: Make a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: false
          files: |
            release-dist/tamarind-${{ env.VERSION }}.tar.gz
            release-dist/tamarind-${{ env.VERSION }}.zip
            release-dist/tamarind-${{ env.VERSION }}-sources.jar
            release-dist/tamarind-${{ env.VERSION }}-javadoc.jar
          tag_name: ${{ github.ref_name != '' && github.ref_name || format('v{0}', env.VERSION) }}
          overwrite_files: true
