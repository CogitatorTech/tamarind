<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Tamarind - Data Lakehouse</title>
  <link rel="icon" type="image/png" href="/assets/logos/logo.png">
  <link rel="apple-touch-icon" href="/assets/logos/logo.png">
  <link rel="shortcut icon" type="image/png" href="/assets/logos/logo.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 400px;
      padding: 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo img {
      height: 64px;
      width: 64px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .logo h1 {
      color: #667eea;
      font-size: 32px;
      margin-bottom: 5px;
    }

    .logo p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .error {
      background: #fee;
      color: #c33;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .success {
      background: #efe;
      color: #3c3;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .toggle-link {
      text-align: center;
      margin-top: 20px;
      color: #666;
      font-size: 14px;
    }

    .toggle-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .toggle-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="logo">
    <img src="/assets/logos/logo.png" alt="Tamarind" style="height:64px; width:64px; object-fit:contain;"/>
    <h1>Tamarind</h1>
    <p>Data Lakehouse Server</p>
  </div>

  <div class="error" id="error"></div>
  <div class="success" id="success"></div>

  <!-- Login Form -->
  <form id="loginForm" style="display: block;">
    <div class="form-group">
      <label for="loginUsername">Username</label>
      <input id="loginUsername" placeholder="Enter your username" required type="text">
    </div>
    <div class="form-group">
      <label for="loginPassword">Password</label>
      <input id="loginPassword" placeholder="Enter your password" required type="password">
    </div>
    <button type="submit">Sign In</button>
    <div class="toggle-link">
      Don't have an account? <a href="#" onclick="toggleForms(); return false;">Sign up</a>
    </div>
  </form>

  <!-- Register Form -->
  <form id="registerForm" style="display: none;">
    <div class="form-group">
      <label for="registerUsername">Username</label>
      <input id="registerUsername" placeholder="Choose a username" required type="text">
    </div>
    <div class="form-group">
      <label for="registerEmail">Email</label>
      <input id="registerEmail" placeholder="Enter your email" required type="email">
    </div>
    <div class="form-group">
      <label for="registerPassword">Password</label>
      <input id="registerPassword" placeholder="Choose a password" required type="password">
    </div>
    <button type="submit">Sign Up</button>
    <div class="toggle-link">
      Already have an account? <a href="#" onclick="toggleForms(); return false;">Sign in</a>
    </div>
  </form>
</div>

<script>
  function toggleForms() {
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const error = document.getElementById('error');
    const success = document.getElementById('success');

    error.style.display = 'none';
    success.style.display = 'none';

    if (loginForm.style.display === 'none') {
      loginForm.style.display = 'block';
      registerForm.style.display = 'none';
    } else {
      loginForm.style.display = 'none';
      registerForm.style.display = 'block';
    }
  }

  function showError(message) {
    const error = document.getElementById('error');
    const success = document.getElementById('success');
    error.textContent = message;
    error.style.display = 'block';
    success.style.display = 'none';
  }

  function showSuccess(message) {
    const error = document.getElementById('error');
    const success = document.getElementById('success');
    success.textContent = message;
    success.style.display = 'block';
    error.style.display = 'none';
  }

  // Login form handler
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('loginUsername').value;
    const password = document.getElementById('loginPassword').value;

    try {
      const response = await fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({username, password})
      });

      if (response.ok) {
        const data = await response.json();
        localStorage.setItem('tamarind_token', data.data.token);
        localStorage.setItem('tamarind_user', JSON.stringify(data.data.user));
        window.location.href = '/dashboard.html';
      } else {
        const error = await response.json();
        showError(error.message || 'Login failed. Please check your credentials.');
      }
    } catch (error) {
      showError('Connection error. Please try again.');
    }
  });

  // Register form handler
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('registerUsername').value;
    const email = document.getElementById('registerEmail').value;
    const password = document.getElementById('registerPassword').value;

    try {
      const response = await fetch('/api/v1/auth/register', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({username, email, password})
      });

      if (response.ok) {
        showSuccess('Account created! Please sign in.');
        setTimeout(() => toggleForms(), 1500);
      } else {
        const error = await response.json();
        showError(error.message || 'Registration failed. Please try again.');
      }
    } catch (error) {
      showError('Connection error. Please try again.');
    }
  });
</script>
</body>
</html>
