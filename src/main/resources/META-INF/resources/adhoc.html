<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Tamarind Ad-hoc Query</title>
  <link rel="icon" type="image/png" href="/assets/logos/logo.png" />
  <style>
    body { margin:0; font-family: system-ui, Arial, sans-serif; display:flex; height:100vh; }
    .sidebar { width:240px; border-right:1px solid #ddd; overflow:auto; background:#fff; }
    .sidebar h3 { margin:0; padding:12px 16px; font-size:13px; text-transform:uppercase; color:#666; }
    .table-list { list-style:none; margin:0; padding:0 8px 16px; }
    .table-item { padding:6px 8px; margin:2px 0; background:#f5f7fa; border-radius:4px; cursor:pointer; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .table-item:hover { background:#e9ecef; }
    .content { flex:1; display:flex; flex-direction:column; }
    .topbar { padding:8px 12px; background:#667eea; color:#fff; display:flex; align-items:center; gap:12px; }
    .topbar button { background:#fff; color:#333; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px; }
    .topbar button:hover { background:#f0f0f0; }
    .editor-wrapper { flex:0 0 230px; padding:12px; background:#fafafa; border-bottom:1px solid #ddd; }
    .results { flex:1; overflow:auto; padding:12px; background:#fff; }
    .sql-input { width:100%; height:180px; }
    .result-table { width:100%; border-collapse:collapse; font-size:13px; }
    .result-table th { background:#667eea; color:#fff; padding:6px; text-align:left; position:sticky; top:0; }
    .result-table td { padding:4px 6px; border-bottom:1px solid #eee; white-space:nowrap; text-overflow:ellipsis; overflow:hidden; max-width:250px; }
    .status { font-size:12px; color:#666; margin-top:6px; }
  </style>
  <script defer src="/assets/js/api-client.js"></script>
  <script defer src="/assets/js/tables-explorer.js"></script>
  <script defer src="/assets/js/columns-cache.js"></script>
  <script defer src="/assets/js/adhoc.js"></script>
</head>
<body>
  <div class="sidebar">
    <h3>Tables</h3>
    <ul id="adhocTableList" class="table-list"><li style="padding:6px;color:#999;">Loading...</li></ul>
  </div>
  <div class="content">
    <div class="topbar">
      <strong>Ad-hoc Query</strong>
      <button onclick="AdhocQuery.run()">Run</button>
      <button onclick="AdhocQuery.clear()">Clear</button>
      <button onclick="AdhocQuery.describe()">Describe</button>
      <button onclick="AdhocQuery.logout()">Logout</button>
      <span id="adhocUser" style="margin-left:auto;font-size:12px;"></span>
    </div>
    <div class="editor-wrapper">
      <textarea id="adhocSql" class="sql-input" placeholder="SELECT * FROM my_table LIMIT 100"></textarea>
      <div class="status" id="adhocStatus"></div>
    </div>
    <div class="results" id="adhocResults"></div>
  </div>
</body>
</html>
