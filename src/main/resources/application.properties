# Tamarind Configuration
# Engine Configuration
tamarind.engine.type=duckdb
tamarind.engine.database-path=:memory:
tamarind.engine.duckdb.access-mode=read_write
tamarind.engine.duckdb.threads=4
tamarind.engine.duckdb.install-httpfs=true
tamarind.engine.duckdb.load-httpfs=true
# Data Configuration
tamarind.data.source=local:./data
# Query Configuration
tamarind.query.timeout-seconds=300
tamarind.query.max-result-rows=10000
tamarind.query.caching-enabled=true
# Connection Pool Configuration
tamarind.connection-pool.maximum-pool-size=10
tamarind.connection-pool.minimum-idle=2
tamarind.connection-pool.connection-timeout=30000
tamarind.connection-pool.idle-timeout=600000
tamarind.connection-pool.max-lifetime=1800000
tamarind.connection-pool.pool-name=DuckDBPool
# Cache Configuration
tamarind.cache.file-list-ttl-minutes=5
tamarind.cache.schema-ttl-minutes=15
tamarind.cache.query-result-ttl-minutes=10
tamarind.cache.max-size=500
# Security Configuration
tamarind.security.rate-limit.enabled=true
tamarind.security.rate-limit.requests-per-minute=100
tamarind.security.rate-limit.capacity=100
tamarind.security.rate-limit.refill-tokens=100
tamarind.security.rate-limit.refill-period-minutes=1
tamarind.security.audit.enabled=true
# Arrow Flight Configuration
tamarind.arrow.enabled=true
tamarind.arrow.host=0.0.0.0
tamarind.arrow.port=8815
tamarind.arrow.allocator-max-memory=9223372036854775807
%test.tamarind.arrow.enabled=false
# Quarkus Configuration
quarkus.application.name=tamarind
# OpenAPI and Swagger UI
quarkus.smallrye-openapi.info-title=Tamarind Data Lakehouse API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.info-description=A fast and flexible data lakehouse server built with DuckDB and Java. Execute SQL queries, manage metadata, and process batch operations.
quarkus.smallrye-openapi.info-contact-name=CogitatorTech
quarkus.smallrye-openapi.info-contact-url=https://github.com/CogitatorTech/tamarind
quarkus.smallrye-openapi.info-license-name=Apache 2.0 / MIT
quarkus.smallrye-openapi.info-license-url=https://github.com/CogitatorTech/tamarind/blob/main/LICENSE-APACHE
quarkus.swagger-ui.enable=true
quarkus.swagger-ui.always-include=true
# Health checks
quarkus.health.openapi.included=true
# Metrics
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics
# HTTP Configuration
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.access-log.enabled=true
# Scheduler
quarkus.scheduler.enabled=true
# Logging
quarkus.log.level=INFO
quarkus.log.category."io.github.cogitatortech.tamarind".level=DEBUG
quarkus.log.category."AUDIT".level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
# Remove embedded users configuration to avoid warnings (extension not present)
# quarkus.security.users.embedded.enabled=true
# quarkus.security.users.embedded.plain-text=true
# quarkus.security.users.embedded.users.admin=admin123
# quarkus.security.users.embedded.users.user=user123
# quarkus.security.users.embedded.roles.admin=admin
# quarkus.security.users.embedded.roles.user=user
# OIDC explicitly disabled unless configured via YAML
quarkus.oidc.enabled=false
